name: Triển khai Hỷ Nhi Care lên GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - config.js
      - app.js
      - db.js
      - sw.js
      - manifest.webmanifest
      - public/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Đóng gói giao diện an toàn
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css config.js app.js db.js sw.js manifest.webmanifest _site/
          cp -R public _site/public
          touch _site/.nojekyll

      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5

      - name: Tải gói trang web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Xuất bản
        id: deployment
        uses: actions/deploy-pages@v4
